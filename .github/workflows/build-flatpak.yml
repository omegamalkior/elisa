name: Build Elisa (album artist option)

on:
  push:
    branches: [album-artist-option]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: elisa-album-artist.flatpak
          manifest-path: org.kde.elisa.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: elisa-album-artist.flatpak

  smoke-test:
    # launch the built app and make sure its screens load before publishing it
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Install
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11
          flatpak install --user -y --noninteractive ./elisa-album-artist.flatpak

      - name: Launch Elisa and check for errors
        run: |
          mkdir -p ~/.var/app/org.kde.elisa/config
          printf '[UiSettings]\nColorScheme=BreezeDark\n[Views]\nInitialView=AllArtists\n' > ~/.var/app/org.kde.elisa/config/elisarc
          dbus-run-session -- xvfb-run -a timeout 40 flatpak run org.kde.elisa > elisa.log 2>&1 || true
          cat elisa.log
          if grep -E "failed to load component|is not a type|unavailable|ReferenceError|TypeError|SyntaxError" elisa.log; then
            echo "::error::Elisa's screens failed to load"; exit 1
          fi

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Publish it as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: album-artist-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Elisa with "Only show album artists" (build ${{ github.run_number }})
          body: |
            Elisa 26.08.3 with the "Only show album artists" option, a Dark Mode toggle and a more modern look.
            Install on Steam Deck / Linux: download elisa-album-artist.flatpak and double-click it (or run
            flatpak install elisa-album-artist.flatpak in Konsole).
          files: elisa-album-artist.flatpak
