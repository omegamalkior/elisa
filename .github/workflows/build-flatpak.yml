name: Build Elisa (album artist option)

on:
  push:
    branches: [album-artist-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: elisa-album-artist.flatpak
          manifest-path: org.kde.elisa.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: elisa-album-artist.flatpak

  full-test:
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
      - name: Install
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb xdotool dbus-x11 python3-pil openbox
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform.GL.default//25.08 || true
          flatpak install --user -y --noninteractive ./elisa-album-artist.flatpak
      - name: Run
        run: |
          dbus-run-session -- ./ci/run-elisa-full-test.sh
          grep COVERDBG results/run1.log | head -20
