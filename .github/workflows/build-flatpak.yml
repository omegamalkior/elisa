name: Build Elisa (album artist option)

on:
  push:
    branches: [album-artist-option, album-artist-test]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  flatpak:
    # Flatpak is paused for now: only the AppImage is built, tested and published.
    # To bring it back, remove the "if: false" lines here and in test-flatpak,
    # and add the Flatpak back to the publish job.
    if: false
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Put the build number into the app (used by its update check)
        run: sed -i "s/-DELISA_FORK_BUILD_NUMBER=0/-DELISA_FORK_BUILD_NUMBER=${BUILD_NUMBER}/" org.kde.elisa.json && grep FORK_BUILD org.kde.elisa.json

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: elisa-album-artist.flatpak
          manifest-path: org.kde.elisa.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: elisa-album-artist.flatpak

  appimage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse
    steps:
      - uses: actions/checkout@v4

      - name: Prepare container
        uses: pkgforge-dev/anylinux-setup-action@v2

      - name: Install dependencies and build Elisa
        run: /bin/sh ./ci/appimage/get-dependencies.sh

      - name: Make the AppImage
        run: /bin/sh ./ci/appimage/make-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  test-flatpak:
    # run the built Flatpak in dark mode on a virtual screen, click through it, take screenshots
    needs: flatpak
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Install
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb xdotool dbus-x11 python3-pil openbox ffmpeg python3-gi gir1.2-gtk-3.0 libarchive-tools
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11
          flatpak install --user -y --noninteractive ./elisa-album-artist.flatpak

      - name: Run Elisa and take screenshots
        env:
          UPDATE_TOKEN: ${{ github.token }}
        run: |
          dbus-run-session -- ./ci/run-elisa-full-test.sh
          cat results/checks.txt
          if grep -E "failed to load component|is not a type|module .* is not installed|ReferenceError|TypeError|SyntaxError|Segmentation|No QtMultimedia backends" results/run*.log; then
            echo "::error::Elisa's screens did not load cleanly"; exit 1
          fi
          if grep -q "^FAIL" results/checks.txt; then echo "::error::A test check failed"; exit 1; fi

      - name: Save screenshots to the album-artist-test-results branch
        if: always()
        run: |
          cd results
          git init -q
          git checkout -q -b album-artist-test-results
          git add -A
          git -c user.name="test bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Flatpak test run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" album-artist-test-results

  test-appimage:
    # the same test with the AppImage on a plain Ubuntu machine
    needs: appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Install a virtual screen and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xdotool dbus-x11 python3-pil openbox ffmpeg python3-gi gir1.2-gtk-3.0 libarchive-tools
          chmod +x dist/*.AppImage
          ls -la dist

      - name: Run Elisa and take screenshots
        env:
          UPDATE_TOKEN: ${{ github.token }}
        run: |
          export APPIMAGE_PATH=$(ls $PWD/dist/*.AppImage | head -n 1)
          dbus-run-session -- ./ci/run-elisa-full-test.sh
          cat results/checks.txt
          if grep -E "failed to load component|is not a type|module .* is not installed|ReferenceError|TypeError|SyntaxError|cannot open shared object|Segmentation|unable to open|Could not open|Unable to load|No QtMultimedia backends" results/run*.log | grep -v -e "VDPAU" -e "TagLib: Could not open file"; then
            echo "::error::Elisa did not start cleanly from the AppImage"; exit 1
          fi
          if grep -q "^FAIL" results/checks.txt; then echo "::error::A test check failed"; exit 1; fi

      - name: Save screenshots to the album-artist-appimage-results branch
        if: always()
        run: |
          cd results
          git init -q
          git checkout -q -b album-artist-appimage-results
          git add -A
          git -c user.name="test bot" -c user.email="bot@users.noreply.github.com" commit -q -m "AppImage test run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" album-artist-appimage-results

  publish:
    # only the main branch publishes, and only when the AppImage test passed
    if: github.ref_name == 'album-artist-option'
    needs: [test-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage

      - name: Publish the AppImage as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: album-artist-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Elisa 26.08.3 – Album Artist support, Dark Mode toggle & modern look (build ${{ github.run_number }})
          body: |
            Elisa 26.08.3 (KDE music player) with:
            - **New:** built-in updater. Elisa looks for a newer build every time it starts and can install it for you (☰ menu → Check for Updates; can be switched off in Settings).
            - **New:** right-click an album or a song to hide it from Elisa or to delete its files from the computer. Hidden music is listed in Settings, where each entry can be switched on/off or removed (which brings it back).
            - **New:** song lists show clean names and 1, 2, 3… numbering instead of odd tag numbers; right-click a song to switch between adjusted names and file names. Albums are ordered by their track numbers even when some songs miss a disc number.
            - **New:** "Elisa: Import to Music" in the file manager's (Dolphin's) right-click menu: moves music files and folders into the Music folder and unpacks archives there.
            - **New:** auto-sort: imported music is sorted into Music/Artist/Album folders by its tags (☰ menu → Sort Music into Artist/Album Folders… does it for everything you already have).
            - **New:** the playlist panel opens at a readable width.
            - Album Artist (TPE2) support: an optional Settings checkbox to group the Artists view by album artist. Off by default, so Elisa shows every artist as usual.
            - A Dark Mode toggle in the ☰ menu, and a more modern look.
            - A Recently Added view, a Sleep Timer (☰ menu) and volume shortcuts (Ctrl+Up / Ctrl+Down).

            **AppImage (any Linux, no install needed):** download `Elisa-album-artist-x86_64.AppImage`, make it executable (right-click → Properties → Permissions → "Is executable") and double-click it.
          files: |
            Elisa-album-artist-x86_64.AppImage
