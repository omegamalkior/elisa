name: Rename the build 10 release

on:
  push:
    branches: [release-rename]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: album-artist-build-10
          name: Elisa 26.08.3 – Album Artist support, Dark Mode toggle & modern look (build 10)
          body: |
            Elisa 26.08.3 (KDE music player) with:
            - Album Artist (TPE2) support: an optional Settings checkbox to group the Artists view by album artist. Off by default, so Elisa shows every artist as usual.
            - A Dark Mode toggle in the ☰ menu.
            - A more modern look: rounded covers and cards, artist initial badges, pill-shaped sidebar.

            **Flatpak (Steam Deck / Linux):** download `elisa-album-artist.flatpak` and double-click it (or run
            `flatpak install elisa-album-artist.flatpak` in Konsole).

            **AppImage (any Linux, no install needed):** download `Elisa-album-artist-x86_64.AppImage`, make it executable
            (right-click → Properties → Permissions → "Is executable", or `chmod +x` in a terminal) and double-click it.
